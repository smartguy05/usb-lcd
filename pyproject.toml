[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usb-lcd-dashboard"
version = "0.12.1"
description = "Live Claude Code and Codex dashboard for a Turing 3.5-inch USB LCD"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  # 10.1 is the real floor: ImageFont.load_default gained its size argument
  # there, and the whole suite passes against Ubuntu 24.04's 10.2, which is
  # what the .deb depends on rather than bundling a Pillow of its own.
  "pillow>=10.1,<13",
  "pyserial>=3.5,<4",
  "pyusb>=1.3,<2",
  "pycryptodome>=3.23,<4",
  # Drives the active-background layer's CPU-linked speed. The layer degrades to
  # a neutral speed if it is ever missing, so the panel never depends on it.
  "psutil>=5.9,<8",
  "libusb-package>=1.0.26.3,<2; sys_platform == 'win32'",
  "winrt-Windows.UI.Notifications>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.UI.Notifications.Management>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.ApplicationModel>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Data.Xml.Dom>=3.2.1,<4; sys_platform == 'win32'",
  "smartscreen-driver @ git+https://github.com/hchargois/smartscreen-driver.git@918342ecbf33d210d41867f083142e3b5cbffcca",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
usb-lcd-dashboard = "usb_lcd_dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/usb_lcd_dashboard"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

