[display]
kind = "turing_rev_a"
device = "/dev/turing-lcd"
width = 480
height = 320
orientation = "landscape"
brightness = 25
refresh_hz = 2.0

[screensaver]
enabled = true
idle_seconds = 600

[dashboard]
active_ttl_seconds = 180
approval_ttl_seconds = 90
tool_ttl_seconds = 900
switch_dwell_seconds = 4.0
idle_title = "AI WORKBENCH"

[ipc]
mode = "unix"
host = "127.0.0.1"
port = 45722

# The settings editor, served on 127.0.0.1 only.
[admin]
enabled = true
port = 45723

# The system tray icon. Windows and Linux; ignored where there is no tray.
[tray]
enabled = true
