# The 9.2" 1920x462 ultra-wide panel: clock, agent, Discord messages and crab.
#
# This panel is a TURZX unit (USB 1CBE:0092) and it speaks native USB, not the
# 3.5" panel's serial protocol — so kind = "turing_usb". "auto" reaches it too,
# by matching the size below against turing_usb.py:PRODUCT_SIZES.
#
# On Linux the raw USB node is root-only until the packaged udev rule tags it;
# `usb-lcd-dashboard doctor` names the exact node when access is the problem.
#
# kind = "simulated" still renders the real frame to screencap.png, which is the
# way to build and preview a layout with the panel unplugged.
[display]
kind = "turing_usb"
device = "AUTO"
width = 1920
height = 462
orientation = "landscape"
brightness = 25
# 8Hz so the crab tile animates smoothly. Only the tiles that actually change
# are pushed to the panel, so a still layout costs no more at 8 than at 2 — but
# drop this back to 2.0 if you have no animated widget.
refresh_hz = 8.0

[display.background]
color = "#081018"
# image = "C:/Users/you/Pictures/panel-wallpaper.png"
fit = "cover"          # cover | contain | stretch | center
card_opacity = 0.82    # 0 to 1; tile-specific opacity wins

[screensaver]
enabled = true
idle_seconds = 600

[dashboard]
active_ttl_seconds = 180
approval_ttl_seconds = 90
tool_ttl_seconds = 900
switch_dwell_seconds = 4.0
idle_title = "AI WORKBENCH"

[ipc]
mode = "tcp"
host = "127.0.0.1"
port = 45722

# The settings editor, served on 127.0.0.1 only.
[admin]
enabled = true
port = 45723

# Tiles are explicit pixel rects: 12px outer margin, 12px gutters.
# The number of session tiles ("agent" and "crab" both count) is the cap on how
# many sessions show at once — three here, so a fourth live session takes turns
# in one of them. Note that the crab tile shows its OWN session, not a second
# view of the one next to it.

[[tile]]
widget = "clock"
x = 12
y = 12
w = 404
h = 438
[tile.options]
title = "HOME"
hour12 = true
seconds = true
show_date = true

[[tile]]
widget = "agent"
x = 428
y = 12
w = 486
h = 438

[[tile]]
widget = "messages"
x = 926
y = 12
w = 486
h = 438
[tile.options]
title = "DISCORD"

[[tile]]
widget = "crab"
x = 1424
y = 12
w = 484
h = 438
[tile.options]
# color = "#d97757"   # blank follows the provider: orange for Claude, green for Codex
animate = true
alarm = true
